name: Flyway Migration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  migrate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flyway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Run migrations
        uses: docker://flyway/flyway:11.9.1
        with:
          args: >-
            -locations=filesystem:/github/workspace/migrations
            -url=jdbc:postgresql://postgres:5432/flyway_test
            -user=postgres
            -password=postgres
            -baselineOnMigrate=true
            migrate
